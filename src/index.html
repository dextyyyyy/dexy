<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نص الطريق الوصول للطريق</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="countdown-container">
    <h1>نص الطريق الوصول للطريق</h1>
    <p>الوقت المتبقي لبداية المعركة </p>
    <div id="countdown">
      <div class="time">
        <span id="days">0</span>
        <p>أيام</p>
      </div>
      <div class="time">
        <span id="hours">0</span>
        <p>ساعات</p>
      </div>
      <div class="time">
        <span id="minutes">0</span>
        <p>دقائق</p>
      </div>
      <div class="time">
        <span id="seconds">0</span>
        <p>ثواني</p>
      </div>
    </div>
  </div>

  <div class="social-link">
    <a href="https://www.instagram.com/o_1k1/" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
    </a>
  </div>

  <script src="script.js"></script>
</body>
</html>
